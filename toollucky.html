    <script>
        // Anti-DevTools Script (Giữ nguyên)
        (function() {
            const devtools = { isOpen: false, orientation: undefined };
            const threshold = 160;
            const emitEvent = (isOpen, orientation) => {
                window.dispatchEvent(new CustomEvent('devtoolschange', { detail: { isOpen, orientation } }));
            };
            const main = ({emitEvents = true} = {}) => {
                const now = Date.now();
                debugger;
                const diff = Date.now() - now;
                if (diff > threshold) {
                    if (!devtools.isOpen) { emitEvent(true); }
                    devtools.isOpen = true;
                } else {
                    if (devtools.isOpen) { emitEvent(false); }
                    devtools.isOpen = false;
                }
            };
            main({emitEvents: false});
            setInterval(main, 500);
            window.addEventListener('devtoolschange', event => {
                if (event.detail.isOpen) {
                    document.body.innerHTML = `<div style="background-color: #000; color: red; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; display: flex; justify-content: center; align-items: center; font-size: 24px; font-family: sans-serif;">PHÁT HIỆN HÀNH VI CỐ TÌNH CAN THIỆP HỆ THỐNG!</div>`;
                    setTimeout(() => { window.location.href = 'index.html'; }, 1500);
                }
            });
            window.addEventListener('contextmenu', e => e.preventDefault(), false);
            window.addEventListener('keydown', e => {
                if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || (e.ctrlKey && e.keyCode === 85)) {
                    e.preventDefault();
                }
            });
        })();

<script>
    const LUCK_API = "luck.php";
    let lastUpdatedPhien = null; // Lưu phiên cuối cùng đã xử lý thành công
    let historyResults = []; // **Mảng lưu trữ lịch sử kết quả (Tài/Xỉu)**
    
    // =================================================================================
    // 7 THUẬT TOÁN CỐT LÕI TỐI ƯU HÓA (Mục tiêu 86% ACCURACY)
    // =================================================================================

    // I. NHÓM TỐC ĐỘ & ĐÀ (SPEED & MOMENTUM) - BẮT CẦU NGẮN

    /**
     * Thuật toán 1: Weighted Recent - Trọng số CỰC CAO cho 5 phiên gần nhất.
     * @param {Array<string>} results - Lịch sử kết quả ('Tài'/'Xỉu').
     * @returns {string} Dự đoán.
     */
    function algo1_weightedRecent(results) {
        if (!results || results.length === 0) return "Tài";
        let t = 0, x = 0;
        const maxLen = Math.min(results.length, 5); 
        for (let i = 0; i < maxLen; i++) {
            // Lấy từ cuối ngược về (results.at(-1-i))
            const w = (i + 1) * 6; // Trọng số CỰC CAO, tăng dần cho phiên mới nhất
            if (results.at(-1 - i) === "Tài") t += w; else x += w;
        }
        return t >= x ? "Tài" : "Xỉu";
    }

    /**
     * Thuật toán 2: Long-Chain Reverse - Phá dây Bệt Cực Ngắn (Reversal after k streak).
     * @param {Array<string>} results - Lịch sử kết quả ('Tài'/'Xỉu').
     * @param {number} k - Độ dài chuỗi tối thiểu để bẻ.
     * @returns {string} Dự đoán.
     */
    function algo2_longChainReverse(results, k = 3) {
        if (!results || results.length < k) return results.at(-1) || "Tài";
        const last = results.at(-1);
        let chain = 1;
        for (let i = results.length - 2; i >= 0; i--) {
            if (results[i] === last) chain++; else break;
        }
        // Nếu bệt 3 lần (hoặc hơn) -> Bẻ cầu
        return chain >= k ? (last === "Tài" ? "Xỉu" : "Tài") : last;
    }

    /**
     * Thuật toán 3: Alternation Detector - Bắt/Bẻ cầu xen kẽ 1-1-1. (Sử dụng logic của bạn)
     * @param {Array<string>} results - Lịch sử kết quả ('Tài'/'Xỉu').
     * @returns {string} Dự đoán.
     */
    function algo3_alternation(results) {
        if (!results || results.length < 4) return results.at(-1) || "Tài";
        const last4 = results.slice(-4);
        let alt = 0;
        for (let i = 0; i < 3; i++) if (last4[i] !== last4[i+1]) alt++;
        // Nếu 3/3 lần xen kẽ -> Dự đoán ngược
        return alt === 3 ? (results.at(-1) === "Tài" ? "Xỉu" : "Tài") : results.at(-1); 
    }

    /**
     * Thuật toán 4: Short-Window Majority - Đa số 4 phiên gần nhất (Bắt đà ngắn).
     * (Thêm thuật toán này để đủ nhóm Momentum)
     * @param {Array<string>} results - Lịch sử kết quả ('Tài'/'Xỉu').
     * @param {number} window - Kích thước cửa sổ.
     * @returns {string} Dự đoán.
     */
    function algo4_windowMajority(results, window = 4) {
        const win = (results || []).slice(-window);
        if (!win.length) return "Tài";
        const t = win.filter(v => v === "Tài").length;
        return t >= Math.ceil(win.length / 2) ? "Tài" : "Xỉu";
    }

    // II. NHÓM ỨC CHẾ SAI LỆCH VÀ CÂN BẰNG CẦU (STABILITY & REVERSAL)

    /**
     * Thuật toán 5: Anti-Entropy (Long-Term) - Chống Độ Lệch Dài Hạn (100 phiên).
     * @param {Array<string>} results - Lịch sử kết quả ('Tài'/'Xỉu').
     * @param {number} longTerm - Độ dài lịch sử để xét.
     * @param {number} deviation - Ngưỡng lệch (e.g., 0.56 = 56%).
     * @returns {string} Dự đoán.
     */
    function algo5_antiEntropy(results, longTerm = 100, deviation = 0.56) {
        if (!results || results.length < longTerm) return results.at(-1) || "Tài";
        const recent = results.slice(-longTerm);
        const tCount = recent.filter(r => r === "Tài").length;
        
        // Nếu Tài quá 56% -> Bẻ Xỉu
        if (tCount / longTerm >= deviation) return "Xỉu"; 
        // Nếu Xỉu quá 56% -> Bẻ Tài
        if ((longTerm - tCount) / longTerm >= deviation) return "Tài"; 
        
        return results.at(-1); // Giữ nguyên kết quả cuối
    }

    /**
     * Thuật toán 6: Adaptive Parity Index - Kết hợp Parity Index và Alternation.
     * (Thêm thuật toán này để đủ nhóm Stability)
     * @param {Array<string>} history - Lịch sử kết quả ('Tài'/'Xỉu').
     * @returns {string} Dự đoán.
     */
    function algo6_parityIndex(history) {
        if (!history || history.length < 5) return history.at(-1) || "Tài";
        let score = 0;
        // Chỉ xét 5 phiên gần nhất
        for (let i = history.length - 5; i < history.length; i++) {
            if ((i % 2 === 0 && history[i] === "Tài") || (i % 2 === 1 && history[i] === "Xỉu")) score++;
            else score--;
        }
        const nextEven = (history.length % 2 === 0);
        // Nếu điểm cao (theo T-X-T-X) -> Tiếp tục mô hình T-X
        if (score >= 2) return nextEven ? "Tài" : "Xỉu";
        // Nếu điểm thấp -> Theo kết quả cuối (hoặc đảo)
        return history.at(-1) === "Tài" ? "Xỉu" : "Tài";
    }

    /**
     * Thuật toán 7: Trend Reversal (Medium-Term) - Bẻ cầu khi có bệt trung bình (7 phiên).
     * (Thêm thuật toán này để đủ nhóm Reversal)
     * @param {Array<string>} results - Lịch sử kết quả ('Tài'/'Xỉu').
     * @param {number} k - Độ dài chuỗi trung bình để bẻ.
     * @returns {string} Dự đoán.
     */
    function algo7_mediumChainReverse(results, k = 7) {
        if (!results || results.length < k) return results.at(-1) || "Tài";
        const last = results.at(-1);
        let chain = 1;
        for (let i = results.length - 2; i >= 0; i--) {
            if (results[i] === last) chain++; else break;
        }
        // Nếu bệt trung bình 7 lần (hoặc hơn) -> Bẻ cầu
        return chain >= k ? (last === "Tài" ? "Xỉu" : "Tài") : last;
    }


    // =================== Hybrid vote (7 thuật toán) ===================
    function hybrid7(history, weights) {
        // Đã đổi tên từ hybrid15 thành hybrid7
        const algos = [
            algo1_weightedRecent, // Tốc độ
            algo2_longChainReverse, // Bẻ ngắn
            algo3_alternation, // Bắt/Bẻ 1-1
            algo4_windowMajority, // Đa số ngắn
            algo5_antiEntropy, // Chống lệch dài hạn
            algo6_parityIndex, // Parity/Alternation
            algo7_mediumChainReverse // Bẻ trung bình
        ];
        
        // Trọng số mặc định (bằng nhau)
        if (!weights || weights.length !== algos.length) weights = Array(algos.length).fill(1);

        let scoreT = 0, scoreX = 0;
        
        for (let i = 0; i < algos.length; i++) {
            let v;
            try {
                // Tận dụng việc bạn đã định nghĩa các hàm có tham số mặc định
                v = algos[i](history); 
            } catch (e) {
                v = history.at(-1) || "Tài";
            }
            if (v === "Tài") scoreT += weights[i]; else scoreX += weights[i];
        }
        
        const totalScore = scoreT + scoreX;
        if (totalScore === 0) return { prediction: history.at(-1) || "Tài", confidence: 50 };

        const prediction = scoreT >= scoreX ? "Tài" : "Xỉu";
        let confidence = Math.round((Math.max(scoreT, scoreX) / totalScore) * 100);
        
        // Điều chỉnh và giới hạn confidence
        confidence = Math.max(1, Math.min(100, confidence));
        
        return { prediction, confidence, scoreT, scoreX };
    }

    // =================================================================

    function runTool() {
        fetchData();
        setInterval(fetchData, 5000); // Lặp lại mỗi 5s

        // Logic kéo thả (giữ nguyên)
        const box = document.getElementById("robotBox");
        let isDragging = false, offsetX = 0, offsetY = 0;
        const startDrag = (e) => {
            isDragging = true;
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            offsetX = clientX - box.offsetLeft;
            offsetY = clientY - box.offsetTop;
        };
        const drag = (e) => {
            if (isDragging) {
                e.preventDefault();
                const clientX = e.clientX || e.touches[0].clientX;
                const clientY = e.clientY || e.touches[0].clientY;
                
                let newLeft = clientX - offsetX;
                let newTop = clientY - offsetY;

                // Giới hạn kéo trong viewport
                const maxX = window.innerWidth - box.offsetWidth - 10;
                const maxY = window.innerHeight - box.offsetHeight - 10;
                
                newLeft = Math.max(10, Math.min(newLeft, maxX));
                newTop = Math.max(10, Math.min(newTop, maxY));
                
                box.style.left = newLeft + "px";
                box.style.top = newTop + "px";
            }
        };
        const endDrag = () => { isDragging = false; };
        box.addEventListener("mousedown", startDrag);
        document.addEventListener("mousemove", drag);
        document.addEventListener("mouseup", endDrag);
        box.addEventListener("touchstart", startDrag, { passive: false });
        document.addEventListener("touchmove", drag, { passive: false });
        document.addEventListener("touchend", endDrag);
    }

    async function fetchData() {
        try {
            const apiUrl = LUCK_API + '?t=' + Date.now(); 
            const res = await fetch(apiUrl);
            
            if (!res.ok) {
                const errorData = await res.json().catch(() => ({ error: "Lỗi không xác định." }));
                throw new Error(errorData.error || `Lỗi HTTP: ${res.status}`);
            }
            
            const data = await res.json();
            
            // --- LẤY DỮ LIỆU TỪ API ---
            const currentPhien = data?.phien; 
            const previousResult = data?.ket_qua; // 'Tài' hoặc 'Xỉu' của phiên hiện tại (đã ra)
            const xuc_xac_1 = data?.xuc_xac_1;
            const xuc_xac_2 = data?.xuc_xac_2;
            const xuc_xac_3 = data?.xuc_xac_3;
            const sumDice = (xuc_xac_1 && xuc_xac_2 && xuc_xac_3) ? xuc_xac_1 + xuc_xac_2 + xuc_xac_3 : null;

            if (!currentPhien) {
                throw new Error("API không trả về mã phiên.");
            }

            // --- CẬP NHẬT LỊCH SỬ KẾT QUẢ VÀ DỰ ĐOÁN CHỈ KHI CÓ PHIÊN MỚI ---
            if (currentPhien !== lastUpdatedPhien) {
                if (previousResult && (previousResult === 'Tài' || previousResult === 'Xỉu')) {
                    // Thêm kết quả mới nhất vào lịch sử
                    historyResults.push(previousResult);
                }

                lastUpdatedPhien = currentPhien;
                
                // --- GỌI HÀM DỰ ĐOÁN MỚI VỚI LỊCH SỬ (HYBRID) ---
                const nextPhien = parseInt(currentPhien) + 1;

                // Chuẩn bị trạng thái hiển thị
                const previousStatus = (previousResult && sumDice) 
                    ? `KQ Phiên #${currentPhien}: ${sumDice} (${previousResult})`
                    : `KQ Phiên #${currentPhien}: Đang chờ...`;
                
                // 1. Hiển thị thông tin phiên đang chờ dự đoán và trạng thái phân tích
                document.getElementById("phien").innerText = `PHIÊN DỰ ĐOÁN: #${nextPhien}`;
                const duDoanEl = document.getElementById("duDoan");
                duDoanEl.innerHTML = 'Analyzing...';
                duDoanEl.classList.remove("du-doan-tai", "du-doan-xiu");
                document.getElementById("cauStatus").innerText = previousStatus; // Hiển thị kết quả phiên cũ (đã ra)

                // 2. Tạo hiệu ứng trễ 3 giây trước khi hiện KẾT QUẢ DỰ ĐOÁN
                setTimeout(() => {
                    const predictionObj = hybrid7(historyResults, null); // **Sử dụng hybrid7 mới**
                    updateDuDoanUI(predictionObj.prediction, predictionObj.confidence, previousStatus);
                }, 3000);
            } else {
                // Đang trong phiên, giữ nguyên trạng thái
                if (!document.getElementById("phien").innerText.includes("#")) {
                    document.getElementById("phien").innerText = `PHIÊN DỰ ĐOÁN: #${parseInt(currentPhien) + 1}`;
                }
                if (document.getElementById("cauStatus").innerText.includes("khởi động") || document.getElementById("cauStatus").innerText.includes("chờ kết quả")) {
                    document.getElementById("cauStatus").innerText = `Phiên #${currentPhien} đang chờ kết quả...`;
                }
            }

        } catch (err) {
            console.error("Lỗi khi fetch dữ liệu:", err.message);
            document.getElementById("phien").innerText = `LỖI API`;
            document.getElementById("duDoan").innerText = `ERROR!`;
            document.getElementById("cauStatus").innerText = `Lỗi: ${err.message}. Retrying...`;
        }
    }

    function updateDuDoanUI(prediction, confidence, status) {
        const duDoanEl = document.getElementById("duDoan");
        
        // Hiển thị kết quả dự đoán kèm tỷ lệ
        duDoanEl.innerHTML = `${prediction || 'N/A'} <span class="confidence-percent">(${confidence}%)</span>`;
        
        // Cập nhật màu sắc và âm thanh
        duDoanEl.classList.remove("du-doan-tai", "du-doan-xiu");
        if (prediction && prediction.includes("Tài")) {
            duDoanEl.classList.add("du-doan-tai");
            document.getElementById("soundTai").play().catch(() => {});
        } else if (prediction && prediction.includes("Xỉu")) {
            duDoanEl.classList.add("du-doan-xiu");
            document.getElementById("soundXiu").play().catch(() => {});
        }
    }

    // --- Logic chuyển đổi giao diện (Giữ nguyên) ---
    document.getElementById('entry-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const gameLink = document.getElementById('linkInput').value;
        if (!gameLink.trim()) {
            Swal.fire({
                background: '#0a0a0f', color: '#ff00ff', title: 'WARNING!',
                text: 'Vui lòng nhập link game để khởi chạy hệ thống.', icon: 'warning',
                iconColor: '#ff00ff', confirmButtonText: 'OK', confirmButtonColor: '#ff00ff'
            });
            return;
        }

        document.getElementById('gameIframe').src = gameLink;
        document.getElementById('login-screen').classList.add('hidden');
        document.body.classList.add('game-active');
        document.getElementById('game-screen').classList.remove('hidden');

        // Khởi chạy tool dự đoán
        runTool();
    });
</script>
